<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mochi Mood Calendar</title>
<style>
  :root{
    --green:#698241;
    --body:#ebefe4;
    --brown:#786353;
    --gray-num:#c2c2c2;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:transparent;font-family:"Times New Roman",Times,serif}
  button{font-family:inherit;border:0;background:none;cursor:pointer}
  .wrap{padding:12px;container-type:inline-size;max-width:900px;margin:0 auto}
  .card{position:relative}
  .head{
    display:block;width:100%;background:var(--green);color:#fff;text-align:center;
    border-radius:18px 18px 0 0;padding:clamp(10px,2.4cqw,22px) 12px;
    font-size:clamp(18px,4.6cqw,42px);font-weight:700;text-transform:uppercase;letter-spacing:.5px;
    transition:filter .15s;
  }
  .head:hover,.head:focus-visible{filter:brightness(1.08);outline:none}
  .head .caret{font-size:.45em;margin-left:8px;vertical-align:middle}
  .body{
    background:var(--body);border-radius:0 0 18px 18px;
    display:grid;grid-template-columns:clamp(16px,3.4cqw,34px) minmax(0,1fr) clamp(16px,3.4cqw,34px);
    align-items:center;gap:2px;padding:clamp(8px,2cqw,20px) clamp(4px,1.2cqw,12px) clamp(10px,2.4cqw,24px);
  }
  .nav{
    color:var(--green);font-weight:700;font-size:clamp(20px,4cqw,38px);line-height:1;
    padding:6px 0;align-self:center;margin-top:clamp(14px,4cqw,40px);
  }
  .nav:hover{transform:scale(1.15)}
  .week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px 2px;min-width:0}
  .dow{text-align:center;font-weight:700;color:var(--green);text-transform:uppercase;
    font-size:clamp(9px,3cqw,28px);padding-bottom:clamp(2px,1cqw,10px)}
  .cell{display:flex;justify-content:center;min-width:0}
  .slot{width:70%;min-width:0}
  .num{display:block;height:1.3em;line-height:1.3;font-size:clamp(8px,1.6cqw,15px);color:var(--gray-num);text-align:left}
  .mochi{
    display:flex;align-items:flex-end;justify-content:center;width:100%;aspect-ratio:67/56;
    padding:0;border-radius:50%;transition:transform .12s;-webkit-tap-highlight-color:transparent;
  }
  .mochi:hover{transform:translateY(-2px)}
  .mochi:active{transform:scale(.92)}
  .mochi:focus-visible{outline:2px solid var(--green);outline-offset:2px}
  .mochi img{width:100%;height:100%;object-fit:contain;object-position:center bottom;display:block;pointer-events:none;-webkit-user-drag:none}
  .mochi img.gray{width:88%;height:auto}

  .totals{
    display:flex;flex-wrap:wrap;justify-content:center;align-items:center;
    gap:clamp(6px,1.6cqw,16px) clamp(10px,3.4cqw,40px);margin-top:clamp(10px,2.6cqw,22px);
  }
  .tot{display:flex;align-items:center;gap:clamp(4px,1.2cqw,12px);font-weight:700;text-transform:uppercase;
    font-size:clamp(11px,2.6cqw,24px);white-space:nowrap}
  .tot img{width:clamp(26px,6.2cqw,56px);height:auto;display:block}
  .tot.g{color:var(--green)} .tot.b{color:var(--brown)}

  .picker{
    position:absolute;z-index:5;top:clamp(48px,9cqw,84px);left:50%;transform:translateX(-50%);
    width:min(340px,calc(100% - 24px));background:#fbfcf7;border-radius:20px;padding:16px;
    box-shadow:0 10px 30px rgba(70,90,40,.25);display:none;
  }
  .picker.open{display:block}
  .yr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .yr b{font-size:24px;color:var(--green)}
  .yr button{width:38px;height:38px;border-radius:50%;background:#dfe6d2;color:var(--green);font-size:22px;font-weight:700}
  .yr button:hover{background:#d0dabd}
  .months{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .months button{padding:10px 4px;border-radius:12px;background:var(--body);color:var(--green);font-size:17px;font-weight:700}
  .months button:hover{background:#dfe6d2}
  .months button.on{background:var(--green);color:#fff}
  .backdrop{position:fixed;inset:0;z-index:4;display:none}
  .backdrop.open{display:block}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <button class="head" id="titleBtn" aria-haspopup="true" aria-expanded="false">
      <span id="titleText">December 2026</span><span class="caret">▼</span>
    </button>
    <div class="body">
      <button class="nav" id="prev" aria-label="Minggu sebelumnya">&lt;</button>
      <div class="week" id="week"></div>
      <button class="nav" id="next" aria-label="Minggu berikutnya">&gt;</button>
    </div>
    <div class="picker" id="picker">
      <div class="yr">
        <button id="yPrev" aria-label="Tahun sebelumnya">‹</button>
        <b id="yLabel">2026</b>
        <button id="yNext" aria-label="Tahun berikutnya">›</button>
      </div>
      <div class="months" id="months"></div>
    </div>
  </div>
  <div class="totals" id="totals" title="Total mood bulan ini"></div>
</div>
<div class="backdrop" id="backdrop"></div>

  function face(t){ return '<img src="'+IMG[t]+'" alt="" draggable="false">'; }
  function gray(){ return '<img class="gray" src="'+IMG.gray+'" alt="" draggable="false">'; }

  var store={};
  try{ store=JSON.parse(localStorage.getItem(KEY)||"{}")||{}; }catch(e){ store={}; }
  function save(){ try{ localStorage.setItem(KEY,JSON.stringify(store)); }catch(e){} }

  var now=new Date();
  var viewY=now.getFullYear(), viewM=now.getMonth(), week=0, pickerY=viewY;
  function firstDow(y,m){ return new Date(y,m,1).getDay(); }
  function daysIn(y,m){ return new Date(y,m+1,0).getDate(); }
  function weeksIn(y,m){ return Math.ceil((firstDow(y,m)+daysIn(y,m))/7); }
  function defaultWeek(y,m){
    if(y===now.getFullYear()&&m===now.getMonth()) return Math.floor((firstDow(y,m)+now.getDate()-1)/7);
    return 0;
  }
  week=defaultWeek(viewY,viewM);

  function keyOf(y,m,d){ return y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0"); }

  // Total (dihitung per bulan, tidak berubah saat ganti minggu; ikut ganti jika bulan/tahun berubah)
  var totals=document.getElementById("totals");
  [["happy","g"],["angry","g"],["sad","b"],["disappointed","b"]].forEach(function(m){
    var t=document.createElement("div"); t.className="tot "+m[1];
    t.innerHTML=face(m[0])+'<span>'+m[0]+' : <span id="cnt-'+m[0]+'">0</span></span>'; totals.appendChild(t);
  });
  function updateCounts(){
    var c={happy:0,angry:0,sad:0,disappointed:0}, pre=viewY+"-"+String(viewM+1).padStart(2,"0")+"-";
    Object.keys(store).forEach(function(k){ if(k.indexOf(pre)===0&&c[store[k]]!==undefined) c[store[k]]++; });
    for(var m in c){ var e=document.getElementById("cnt-"+m); if(e) e.textContent=c[m]; }
  }

  function render(){
    document.getElementById("titleText").textContent=MONTHS[viewM]+" "+viewY;
    updateCounts();
    var box=document.getElementById("week"); box.innerHTML="";
    DOW.forEach(function(d){ var e=document.createElement("div"); e.className="dow"; e.textContent=d; box.appendChild(e); });
    var first=firstDow(viewY,viewM), days=daysIn(viewY,viewM);
    for(var c=0;c<7;c++){
      var day=week*7+c-first+1, cell=document.createElement("div"); cell.className="cell";
      if(day>=1&&day<=days){
        (function(day){
          var k=keyOf(viewY,viewM,day), slot=document.createElement("div"); slot.className="slot";
          var n=document.createElement("span"); n.className="num"; n.textContent=SHOW_DAY_NUMBERS?day:"";
          var b=document.createElement("button"); b.className="mochi";
          function paint(){
            var mood=store[k]||null; b.innerHTML=mood?face(mood):gray();
            b.setAttribute("aria-label",day+" "+MONTHS[viewM]+" "+viewY+": "+(mood||"belum diisi"));
          }
          b.addEventListener("click",function(){
            var next=CYCLE[(CYCLE.indexOf(store[k]||null)+1)%CYCLE.length];
            if(next) store[k]=next; else delete store[k];
            save(); paint(); updateCounts();
          });
          paint(); slot.appendChild(n); slot.appendChild(b); cell.appendChild(slot);
        })(day);
      }
      box.appendChild(cell);
    }
  }

  // Navigasi minggu: < dan >
  document.getElementById("prev").addEventListener("click",function(){
    if(week>0){ week--; }
    else{ viewM--; if(viewM<0){ viewM=11; viewY--; } week=weeksIn(viewY,viewM)-1; }
    render();
  });
  document.getElementById("next").addEventListener("click",function(){
    if(week<weeksIn(viewY,viewM)-1){ week++; }
    else{ viewM++; if(viewM>11){ viewM=0; viewY++; } week=0; }
    render();
  });

  // Pilih bulan & tahun
  var picker=document.getElementById("picker"), backdrop=document.getElementById("backdrop"),
      titleBtn=document.getElementById("titleBtn");
  function renderPicker(){
    document.getElementById("yLabel").textContent=pickerY;
    var box=document.getElementById("months"); box.innerHTML="";
    SHORT.forEach(function(n,i){
      var b=document.createElement("button"); b.textContent=n;
      if(pickerY===viewY&&i===viewM) b.className="on";
      b.addEventListener("click",function(){ viewY=pickerY; viewM=i; week=defaultWeek(viewY,viewM); closePicker(); render(); });
      box.appendChild(b);
    });
  }
  function openPicker(){ pickerY=viewY; renderPicker(); picker.classList.add("open"); backdrop.classList.add("open"); titleBtn.setAttribute("aria-expanded","true"); }
  function closePicker(){ picker.classList.remove("open"); backdrop.classList.remove("open"); titleBtn.setAttribute("aria-expanded","false"); }
  titleBtn.addEventListener("click",function(){ picker.classList.contains("open")?closePicker():openPicker(); });
  backdrop.addEventListener("click",closePicker);
  document.addEventListener("keydown",function(e){ if(e.key==="Escape") closePicker(); });
  document.getElementById("yPrev").addEventListener("click",function(){ pickerY--; renderPicker(); });
  document.getElementById("yNext").addEventListener("click",function(){ pickerY++; renderPicker(); });

  render();
})();
</script>
